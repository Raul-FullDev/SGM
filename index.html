<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>SGM - Login</title>

    <link rel="stylesheet" href="-css/pages/style.css" />
  </head>

  <body>
    <main class="login-container">
      <!-- ================================ -->
      <!--           LADO ESQUERDO          -->
      <!-- ================================ -->

      <section class="lado-esquerdo">
        <!-- Elementos decorativos -->
        <div class="forma-decorativa forma-superior"></div>
        <div class="forma-decorativa forma-lateral"></div>
        <div class="circulo-decorativo"></div>

        <div class="conteudo-logo">
          <h1 class="logo-sgm">SGM</h1>

          <div class="linha-logo"></div>

          <p class="descricao-logo">SISTEMA DE GESTÃO DE MANUTENÇÃO</p>

          <p class="slogan-logo">
            Mais controle.<br />
            Mais eficiência.<br />
            Mais resultados.
          </p>
        </div>

        <div class="rodape-esquerdo">
          <span></span>
          <p>
            MANUTENÇÃO HOJE<br />
            <strong>UM AMANHÃ MAIS EFICIENTE</strong>
          </p>
        </div>
      </section>

      <!-- ================================ -->
      <!--            LADO DIREITO          -->
      <!-- ================================ -->

      <section class="lado-direito">
        <!-- Elementos decorativos -->
        <div class="forma-direita forma-direita-topo"></div>
        <div class="forma-direita forma-direita-baixo"></div>

        <div class="card-login">
          <!-- Ícone -->
          <div class="area-icone">
            <div class="icone-usuario">
              <svg
                class="icon-user"
                xmlns="http://www.w3.org/2000/svg"
                viewBox="0 0 24 24"
                fill="none"
                stroke="currentColor"
                stroke-width="1.8"
                stroke-linecap="round"
                stroke-linejoin="round"
                aria-hidden="true"
              >
                <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path>
                <circle cx="12" cy="7" r="4"></circle>
              </svg>
            </div>
          </div>

          <!-- Título -->
          <div class="cabecalho-login">
            <h2 class="titulo-login">Bem-vindo de volta!</h2>

            <p class="subtitulo-login">Acesse o sistema para continuar.</p>
          </div>

          <!-- ================================ -->
          <!--             FORMULÁRIO           -->
          <!-- ================================ -->

          <form
            class="formulario-login"
            id="formularioLogin"
            onsubmit="entrarSistema(event)"
          >
            <!-- Matrícula -->
            <div class="campo-formulario">
              <label for="matricula"> Matrícula </label>

              <div class="input-container">
                <span class="icone-input" aria-hidden="true">
                  <svg
                    class="icon-user"
                    xmlns="http://www.w3.org/2000/svg"
                    viewBox="0 0 24 24"
                    fill="none"
                    stroke="currentColor"
                    stroke-width="1.8"
                    stroke-linecap="round"
                    stroke-linejoin="round"
                  >
                    <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path>
                    <circle cx="12" cy="7" r="4"></circle>
                  </svg>
                </span>

                <input
                  type="text"
                  id="matricula"
                  name="matricula"
                  placeholder="Digite sua matrícula"
                  autocomplete="username"
                  required
                />
              </div>
            </div>

            <!-- Senha -->
            <div class="campo-formulario">
              <label for="senha"> Senha </label>

              <div class="input-container">
                <span class="icone-input" aria-hidden="true">
                  <svg
                    class="icon-lock"
                    xmlns="http://www.w3.org/2000/svg"
                    viewBox="0 0 24 24"
                    fill="none"
                    stroke="currentColor"
                    stroke-width="1.8"
                    stroke-linecap="round"
                    stroke-linejoin="round"
                  >
                    <rect
                      x="3"
                      y="11"
                      width="18"
                      height="11"
                      rx="2"
                      ry="2"
                    ></rect>

                    <path d="M7 11V7a5 5 0 0 1 10 0v4"></path>
                  </svg>
                </span>

                <input
                  type="password"
                  id="senha"
                  name="senha"
                  placeholder="Digite sua senha"
                  autocomplete="current-password"
                  required
                />

                <button
                  type="button"
                  class="icone-olho"
                  id="botaoSenha"
                  aria-label="Mostrar senha"
                  onclick="alternarSenha()"
                >
                  <svg
                    id="iconeOlho"
                    xmlns="http://www.w3.org/2000/svg"
                    viewBox="0 0 24 24"
                    fill="none"
                    stroke="currentColor"
                    stroke-width="1.8"
                    stroke-linecap="round"
                    stroke-linejoin="round"
                    aria-hidden="true"
                  >
                    <path
                      d="M2 12s3.5-6 10-6 10 6 10 6-3.5 6-10 6S2 12 2 12z"
                    ></path>
                    <circle cx="12" cy="12" r="2.5"></circle>
                  </svg>
                </button>
              </div>
            </div>

            <!-- Opções -->
            <div class="opcoes-login">
              <div class="lembrar-dados">
                <input type="checkbox" id="lembrar" name="lembrar" />

                <label for="lembrar"> Lembrar meus dados </label>
              </div>

              <a href="#" class="link-senha" onclick="event.preventDefault()">
                Esqueci minha senha
              </a>
            </div>

            <!-- Botão -->
            <button type="submit" class="botao-login">
              <span>Entrar no Sistema</span>

              <svg
                xmlns="http://www.w3.org/2000/svg"
                viewBox="0 0 24 24"
                fill="none"
                stroke="currentColor"
                stroke-width="2"
                stroke-linecap="round"
                stroke-linejoin="round"
                aria-hidden="true"
              >
                <line x1="5" y1="12" x2="19" y2="12"></line>
                <polyline points="12 5 19 12 12 19"></polyline>
              </svg>
            </button>
          </form>
        </div>

        <!-- Rodapé direito -->
        <div class="rodape-direito">
          <span></span>
          <p>SGM&nbsp;&nbsp; | &nbsp;&nbsp;SISTEMA DE GESTÃO DE MANUTENÇÃO</p>
        </div>
      </section>
    </main>

    <!-- ================================ -->
    <!--          FUNCIONALIDADES         -->
    <!-- ================================ -->

    <script>
      // ==========================================
      // CONFIGURAÇÕES DA API SUPABASE
      // ==========================================
      const baseUrl = "https://umvtsquzpugempndwitx.supabase.co/rest/v1";
      const apiKey = "sb_publishable_58JIZcrwwFjp2gnEPPVZeg_tkrJ-LHb";
      const headersConfig = {
        "Content-Type": "application/json",
        apikey: apiKey,
        Authorization: `Bearer ${apiKey}`,
      };

      // ==========================================
      // MOSTRAR/OCULTAR SENHA
      // ==========================================
      function alternarSenha() {
        const senha = document.getElementById("senha");
        const botao = document.getElementById("botaoSenha");
        const mostrando = senha.type === "text";

        senha.type = mostrando ? "password" : "text";
        botao.setAttribute(
          "aria-label",
          mostrando ? "Mostrar senha" : "Ocultar senha",
        );
      }

      // ==========================================
      // AUTENTICAÇÃO NO BANCO DE DADOS
      // ==========================================
      async function entrarSistema(event) {
        event.preventDefault();

        const matricula = document.getElementById("matricula").value.trim();
        const senha = document.getElementById("senha").value.trim();
        const botaoLogin = document.querySelector(".botao-login");
        const textoBotaoOriginal = botaoLogin.innerHTML;

        if (!matricula || !senha) return;

        botaoLogin.innerHTML = "<span>Verificando...</span>";
        botaoLogin.disabled = true;

        try {
          // CORREÇÃO: Puxando da tabela nivel(funcao)
          const url = `${baseUrl}/usuario?select=*,nivel(funcao)&matricula=eq.${matricula}&senha=eq.${senha}`;

          const resposta = await fetch(url, {
            method: "GET",
            headers: headersConfig,
          });
          if (!resposta.ok) throw new Error("Erro na conexão com o banco.");

          const usuarios = await resposta.json();

          if (usuarios.length === 0) {
            alert("Matrícula ou senha incorretos!");
            return;
          }

          const usuarioLogado = usuarios[0];

          if (usuarioLogado.is_active === false) {
            alert("Usuário desativado. Procure a administração.");
            return;
          }

          // Salvar crachá (Sessão)
          const dadosSessao = {
            id: usuarioLogado.id,
            nome: usuarioLogado.nome,
            matricula: usuarioLogado.matricula,
            id_papel: usuarioLogado.id_papel,
            nome_papel: usuarioLogado.nivel
              ? usuarioLogado.nivel.funcao
              : "Indefinido",
          };

          localStorage.setItem("sgm_sessao", JSON.stringify(dadosSessao));
          window.location.href = "_pages/dashboard.html";
        } catch (erro) {
          console.error(erro);
          alert("Erro ao fazer login.");
        } finally {
          botaoLogin.innerHTML = textoBotaoOriginal;
          botaoLogin.disabled = false;
        }
      }
    </script>
  </body>
</html>
