<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />

    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>SGM - Nova Ordem de Serviço</title>

    <link rel="stylesheet" href="../-css/pages/abrir_os.css" />
  </head>

  <body>
    <div class="layout">
      <!-- Menu lateral -->
      <aside class="sidebar" id="sidebar">
        <div class="sidebar-header">
          <div class="logo">
            <span class="logo-icon">S</span>

            <div class="logo-text">
              <strong>SGM</strong>

              <span>Gestão de manutenção</span>
            </div>
          </div>
        </div>

        <nav class="sidebar-nav" aria-label="Navegação principal">
          <ul class="nav-list">
            <!-- Dashboard -->

            <li class="nav-item">
              <a href="dashboard.html" class="nav-link">
                <span class="nav-icon">▣</span>

                <span>Dashboard</span>
              </a>
            </li>

            <!-- Ordens de Serviço -->

            <li class="nav-item active">
              <button class="nav-link" type="button" data-menu="ordens">
                <span class="nav-icon">▤</span>

                <span>Ordens de Serviço</span>

                <span class="nav-arrow">⌃</span>
              </button>

              <ul class="submenu">
                <li class="submenu-item">
                  <a href="todas_os.html"> Todas as OS </a>
                </li>

                <li class="submenu-item active">
                  <a href="abrir_os.html"> Abrir OS </a>
                </li>
              </ul>
            </li>

            <!-- Equipamentos -->

            <li class="nav-item">
              <button class="nav-link" type="button" data-menu="equipamentos">
                <span class="nav-icon">▢</span>

                <span>Equipamentos</span>

                <span class="nav-arrow">⌄</span>
              </button>
            </li>

            <!-- Manutenção -->

            <li class="nav-item">
              <button class="nav-link" type="button" data-menu="manutencao">
                <span class="nav-icon">⚒</span>

                <span>Manutenção</span>

                <span class="nav-arrow">⌄</span>
              </button>
            </li>

            <!-- Peças -->

            <li class="nav-item">
              <button class="nav-link" type="button" data-menu="pecas">
                <span class="nav-icon">⬡</span>

                <span>Peças</span>

                <span class="nav-arrow">⌄</span>
              </button>
            </li>

            <!-- Administração -->

            <li class="nav-item">
              <button class="nav-link" type="button" data-menu="administracao">
                <span class="nav-icon">♧</span>

                <span>Administração</span>

                <span class="nav-arrow">⌄</span>
              </button>
            </li>
          </ul>
        </nav>
      </aside>

      <!-- Área principal -->
      <div class="main-wrapper">
        <!-- Cabeçalho -->
        <header class="topbar">
          <div class="topbar-left">
            <div class="global-search"></div>
          </div>

          <div class="topbar-right">
            <button
              class="notification-button"
              id="notificationButton"
              type="button"
              aria-label="Notificações"
            ></button>

            <div class="user-profile">
              <div class="user-avatar">AS</div>

              <div class="user-info">
                <strong>Admin Sistema</strong>

                <span>Administrador</span>
              </div>

              <span class="profile-arrow"> ⌄ </span>
            </div>
          </div>
        </header>

        <!-- Conteúdo -->
        <main class="main-content">
          <div class="page-header">
            <div class="breadcrumb"></div>

            <h1>Nova Ordem de Serviço</h1>
          </div>

          <!-- Formulário -->
          <section class="service-order-card">
            <!-- Cabeçalho do formulário -->

            <div class="service-order-header">
              <div class="service-order-icon">
                <svg
                  width="22"
                  height="22"
                  viewBox="0 0 24 24"
                  fill="none"
                  stroke="currentColor"
                  stroke-width="1.7"
                  stroke-linecap="round"
                  stroke-linejoin="round"
                  aria-hidden="true"
                >
                  <path
                    d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"
                  ></path>

                  <path d="M14 2v6h6"></path>

                  <path d="M8 13h8"></path>

                  <path d="M8 17h5"></path>
                </svg>
              </div>

              <div class="service-order-title">
                <h2>Detalhes da Ordem</h2>

                <p>Preencha as informações para abrir uma nova OS</p>
              </div>
            </div>

            <div class="service-order-divider"></div>

            <form id="formularioOrdemServico" class="formulario-os">
              <!-- Equipamento -->

              <div class="campo-formulario">
                <label for="equipamento"> Equipamento </label>

                <select id="equipamento" name="equipamento" required>
                  <option value="">Selecione um equipamento...</option>

                  <option value="eqp-00125">
                    Compressor de Ar - EQP-00125
                  </option>

                  <option value="eqp-00126">
                    Esteira Transportadora - EQP-00126
                  </option>

                  <option value="eqp-00127">
                    Bomba Hidráulica - EQP-00127
                  </option>

                  <option value="eqp-00128">Motor Elétrico - EQP-00128</option>
                </select>
              </div>

              <!-- Tipo de manutenção -->

              <div class="campo-formulario">
                <label for="tipoManutencao"> Tipo de Manutenção </label>

                <select id="tipoManutencao" name="tipoManutencao" required>
                  <option value="corretivo">Corretivo</option>

                  <option value="preventivo">Preventivo</option>

                  <option value="preditivo">Preditivo</option>
                </select>
              </div>

              <!-- Descrição -->

              <div class="campo-formulario">
                <label for="descricaoProblema"> Descrição do problema </label>

                <textarea
                  id="descricaoProblema"
                  name="descricaoProblema"
                  rows="5"
                  placeholder="Descreva detalhadamente o problema identificado..."
                  required
                ></textarea>
              </div>

              <!-- Solicitante -->

              <div class="campo-formulario">
                <label for="solicitante"> Solicitante </label>

                <div class="solicitante">
                  <div class="solicitante-avatar">AS</div>

                  <div class="solicitante-info">
                    <strong> Admin Sistema </strong>

                    <span> Administrador do Sistema </span>
                  </div>

                  <span class="solicitante-status"> Automático </span>
                </div>
              </div>

              <div class="formulario-divisor"></div>

              <!-- Ações -->

              <div class="formulario-acoes">
                <a href="todas_os.html" class="botao botao-secundario">
                  <span>×</span>

                  Cancelar
                </a>

                <button
                  type="submit"
                  class="botao botao-principal"
                  id="criarOrdemButton"
                >
                  <span>✓</span>

                  Criar Ordem de Serviço
                </button>
              </div>
            </form>
          </section>
        </main>
      </div>
    </div>

    <script src="../-js/global.js"></script>
  </body>
</html>
