            <!-- ========================================== -->
            <!-- NOVOS MENUS ADICIONADOS PELO SEU COLEGA    -->

                <span class="nav-icon"><i class="bi bi-collection"></i></span>

      <!-- Área principal -->
      <div class="main-wrapper">
        <!-- Cabeçalho -->
        <header class="topbar">
          <div class="topbar-left">
            <div class="global-search"></div>
          </div>

          <div class="topbar-right">
            <!-- ÍCONE DO SINO ADICIONADO AQUI -->
            <button
              class="notification-button"
              id="notificationButton"
              type="button"
              aria-label="Notificações"
            >
              
            </button>

            <div class="user-profile">
              <div class="user-avatar">AS</div>
              <div class="user-info">
                <strong>Admin Sistema</strong>
                <span>Administrador</span>
              </div>
         
            </div>
          </div>
        </header>

        <!-- Conteúdo -->
        <main class="main-content">
          <div class="page-header">
            <div class="breadcrumb"></div>
            <h1>Nova Ordem de Serviço</h1>
          </div>

          <!-- Formulário -->
          <section class="service-order-card">
            <!-- Cabeçalho do formulário -->
            <div class="service-order-header">
              <div class="service-order-icon">
                <svg
                  width="22"
                  height="22"
                  viewBox="0 0 24 24"
                  fill="none"
                  stroke="currentColor"
                  stroke-width="1.7"
                  stroke-linecap="round"
                  stroke-linejoin="round"
                  aria-hidden="true"
                >
                  <path
                    d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"
                  ></path>
                  <path d="M14 2v6h6"></path>
                  <path d="M8 13h8"></path>
                  <path d="M8 17h5"></path>
                </svg>
              </div>

              <div class="service-order-title">
                <h2>Detalhes da Ordem</h2>
                <p>Preencha as informações para abrir uma nova OS</p>
              </div>
            </div>

            <div class="service-order-divider"></div>

            <form id="formularioOrdemServico" class="formulario-os">
              <!-- Equipamento -->
              <div class="campo-formulario">
                <label for="equipamento"> Equipamento </label>
                <select id="equipamento" name="equipamento" required>
                  <option value="">Selecione um equipamento...</option>
                  <option value="1">Compressor de Ar - EQP-00125</option>
                  <option value="2">Esteira Transportadora - EQP-00126</option>
                  <option value="3">Bomba Hidráulica - EQP-00127</option>
                  <option value="4">Motor Elétrico - EQP-00128</option>
                </select>
              </div>

              <!-- Tipo de manutenção -->
              <div class="campo-formulario">
                <label for="tipoManutencao"> Tipo de Manutenção </label>
                <select id="tipoManutencao" name="tipoManutencao" required>
                  <option value="">Selecione...</option>
                  <option value="1">Corretivo</option>
                  <option value="2">Preventivo</option>
                  <option value="3">Preditivo</option>
                </select>
              </div>

              <!-- Descrição -->
              <div class="campo-formulario">
                <label for="descricaoProblema"> Descrição do problema </label>
                <textarea
                  id="descricaoProblema"
                  name="descricaoProblema"
                  rows="5"
                  placeholder="Descreva detalhadamente o problema identificado..."
                  required
                ></textarea>
              </div>

              
              <!-- ========================================== -->
               <!-- PRIORIDADE E TECNICO ALOCADO RETIRADOS!!! -->
              <!-- ========================================== -->

              <!-- Solicitante -->
              <div class="campo-formulario">
                <label for="solicitante"> Solicitante </label>
                <div class="solicitante">
                  <div class="solicitante-avatar">AS</div>
                  <div class="solicitante-info">
                    <strong> Admin Sistema </strong>
                    <span> Administrador do Sistema </span>
                  </div>
                  <span class="solicitante-status"> Automático </span>
                </div>
              </div>

              <div class="formulario-divisor"></div>

              <!-- Ações -->
              <div class="formulario-acoes">
                <!-- Mantido o caminho correto para 'todas_os.html' -->
                <a href="todas_os.html" class="botao botao-secundario">
                  <span>×</span> Cancelar
                </a>

                <button
                  type="submit"
                  class="botao botao-principal"
                  id="criarOrdemButton"
                >
                  <span>✓</span> Criar Ordem de Serviço
                </button>
              </div>
            </form>
          </section>
        </main>
      </div>
    </div>

    <!-- Mantido o script correto da sua organização -->
    <script src="../-js/global.js"></script>
    <script src="../-js/pages/abrir_os.js"></script>
