<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>SGM - Ordens de Serviço</title>

    <link rel="stylesheet" href="../-css/pages/todas_os.css" />
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css"
    />
  </head>

  <body>
    <div class="layout">
      <aside class="barra-lateral" id="barraLateral">
        <div class="cabecalho-barra">
          <div class="logo">
            <span class="icone-logo">S</span>
            <div class="texto-logo">
              <strong>SGM</strong>
              <span>Gestão de manutenção</span>
            </div>
          </div>
        </div>

        <nav class="navegacao-lateral" aria-label="Navegação principal">
          <ul class="lista-navegacao">
            <li class="item-navegacao">
              <a href="dashboard.html">
                <button
                  class="link-navegacao"
                  type="button"
                  data-menu="dashboard"
                >
                  <span class="icone-navegacao"
                    ><i class="bi bi-list-task"></i
                  ></span>
                  <span> Dashboard </span>
                </button>
              </a>
            </li>

            <li class="item-navegacao ativo">
              <button
                class="link-navegacao"
                type="button"
                data-menu="ordens-servico"
              >
                <span class="icone-navegacao"
                  ><i class="bi bi-clipboard-data"></i
                ></span>
                <span>Ordens de Serviço</span>
              </button>
            </li>

            <li class="item-navegacao">
              <a href="equipamentos.html">
                <button
                  class="link-navegacao"
                  type="button"
                  data-menu="equipamentos"
                >
                  <span class="icone-navegacao"
                    ><i class="bi bi-wrench-adjustable"></i
                  ></span>
                  <span>Equipamentos</span>
                </button>
              </a>
            </li>

            <li class="item-navegacao">
              <a href="setor_adm.html">
                <button class="link-navegacao" type="button" data-menu="setor">
                  <span class="icone-navegacao"
                    ><i class="bi bi-collection"></i
                  ></span>
                  <span>Setor</span>
                </button>
              </a>
            </li>

            <li class="item-navegacao">
              <a href="historico_adm.html">
                <button
                  class="link-navegacao"
                  type="button"
                  data-menu="historico"
                >
                  <span class="icone-navegacao"
                    ><i class="bi bi-clock-history"></i
                  ></span>
                  <span>Histórico</span>
                </button>
              </a>
            </li>

            <li class="item-navegacao">
              <a href="indicadores_adm.html">
                <button
                  class="link-navegacao"
                  type="button"
                  data-menu="indicadores"
                >
                  <span class="icone-navegacao"
                    ><i class="bi bi-bar-chart"></i
                  ></span>
                  <span>Indicadores</span>
                </button>
              </a>
            </li>

            <li class="item-navegacao">
              <a href="relatorios_adm.html">
                <button
                  class="link-navegacao"
                  type="button"
                  data-menu="relatorios"
                >
                  <span class="icone-navegacao"
                    ><i class="bi bi-file-earmark-text"></i
                  ></span>
                  <span>Relatórios</span>
                </button>
              </a>
            </li>

            <li class="item-navegacao">
              <a href="manutencao_adm.html">
                <button
                  class="link-navegacao"
                  type="button"
                  data-menu="manutencao"
                >
                  <span class="icone-navegacao"
                    ><i class="bi bi-tools"></i
                  ></span>
                  <span>Manutenção</span>
                </button>
              </a>
            </li>

            <li class="item-navegacao">
              <a href="pecas_adm.html">
                <button class="link-navegacao" type="button" data-menu="pecas">
                  <span class="icone-navegacao"><i class="bi bi-nut"></i></span>
                  <span>Peças</span>
                </button>
              </a>
            </li>

            <li class="item-navegacao">
              <a href="usuarios.html">
                <button
                  class="link-navegacao"
                  type="button"
                  data-menu="administracao"
                >
                  <span class="icone-navegacao"
                    ><i class="bi bi-people"></i
                  ></span>
                  <span> Administração </span>
                </button>
              </a>
            </li>
          </ul>
        </nav>
      </aside>

      <div class="area-principal">
        <header class="cabecalho">
          <div class="cabecalho-esquerdo">
            <button
              class="botao-menu"
              id="botaoMenu"
              type="button"
              aria-label="Abrir menu"
            >
              ☰
            </button>
          </div>

          <div class="cabecalho-direito">

            <div
              class="notificacao-container"
              style="position: relative; display: flex; align-items: center"
            >
              <button
                class="botao-notificacao"
                id="botaoNotificacao"
                type="button"
                aria-label="Notificações"
              >
                <i class="bi bi-bell"></i>
                <span class="badge-notificacao" style="display: none">0</span>
              </button>

              <div class="dropdown-notificacoes" id="dropdownNotificacoes">
                <div class="dropdown-cabecalho-noti">
                  <span class="dropdown-titulo">Notificações</span>
                  <button
                    type="button"
                    class="btn-marcar-lidas"
                    id="btnMarcarLidasGlobal"
                  >
                    Marcar como lidas
                  </button>
                </div>

                <div class="lista-notificacoes" id="containerListaNotificacoes">
                  <p
                    style="
                      text-align: center;
                      font-size: 11px;
                      color: #8b9ab1;
                      padding: 25px 15px;
                    "
                  >
                    Nenhuma notificação no momento.
                  </p>
                </div>
              </div>
            </div>

            <div class="perfil-container" style="position: relative">
              <div
                class="user-profile"
                id="botaoPerfil"
                style="
                  cursor: pointer;
                  display: flex;
                  align-items: center;
                  gap: 12px;
                "
              >
                <div class="user-avatar avatar-usuario">AS</div>
                <div class="user-info informacoes-usuario">
                  <strong>Admin Sistema</strong>
                  <span>Administrador</span>
                </div>
                <i
                  class="bi bi-chevron-down"
                  style="color: #8a9cb4; font-size: 12px; margin-left: 5px"
                ></i>
              </div>

              <div class="dropdown-perfil" id="dropdownPerfil">
                <div class="dropdown-cabecalho">
                  <span class="dropdown-titulo">Conta</span>
                </div>
                <div class="dropdown-divisor"></div>
                <a href="perfil.html" class="dropdown-item">
                  <i class="bi bi-person"></i> Meu Perfil
                </a>
                <div class="dropdown-divisor"></div>
                <button
                  type="button"
                  class="dropdown-item sair"
                  onclick="sairSistema()"
                >
                  <i class="bi bi-box-arrow-right"></i> Sair do Sistema
                </button>
              </div>
            </div>
          </div>
        </header>

        <main class="conteudo-principal">
          <div class="cabecalho-pagina">
            <div class="caminho-pagina"></div>

            <div class="titulo-com-botao">
              <h1>Ordens de Serviço</h1>
              <a href="abrir_os.html" class="botao-principal" id="btnNovaOS">
                <span>+</span> Nova Ordem de Serviço
              </a>
            </div>
          </div>

          <section class="filtros-os">
            <form class="formulario-filtros" id="formularioFiltros">
              <div class="campo-pesquisa-os">
                <span class="icone-pesquisa">⌕</span>
                <input
                  type="search"
                  id="pesquisaOS"
                  name="pesquisa"
                  placeholder="Pesquisar OS, equipamento..."
                  autocomplete="off"
                />
              </div>

              <div class="campo-filtro grupo-filtro-data">
                <label for="filtroDataCriacao" class="label-filtro-data"
                  >Início</label
                >
                <input
                  type="date"
                  id="filtroDataCriacao"
                  name="dataCriacao"
                  class="input-data"
                  title="Filtrar por Data de Início"
                />
              </div>

              <div class="campo-filtro grupo-filtro-data">
                <label for="filtroDataFim" class="label-filtro-data">Fim</label>
                <input
                  type="date"
                  id="filtroDataFim"
                  name="dataFim"
                  class="input-data"
                  title="Filtrar por Data de Fim"
                />
              </div>

              <div class="campo-filtro">
                <label for="filtroStatus" class="sr-only"
                  >Filtrar por status</label
                >
                <select id="filtroStatus" name="status">
                  <option value="todos">Todos os status</option>
                </select>
              </div>

              <div class="campo-filtro">
                <label for="filtroTipo" class="sr-only">Filtrar por tipo</label>
                <select id="filtroTipo" name="tipo">
                  <option value="todos">Todos os tipos</option>
                </select>
              </div>

              <div class="campo-filtro">
                <label for="filtroSetor" class="sr-only"
                  >Filtrar por setor</label
                >
                <select id="filtroSetor" name="setor">
                  <option value="todos">Todos os setores</option>
                  <option value="producao">Produção</option>
                  <option value="embalagem">Embalagem</option>
                  <option value="logistica">Logística</option>
                  <option value="usinagem">Usinagem</option>
                  <option value="estamparia">Estamparia</option>
                  <option value="fabricacao">Fabricação</option>
                  <option value="manutencao">Manutenção</option>
                  <option value="montagem">Montagem</option>
                </select>
              </div>

              <span class="quantidade-registros" id="quantidadeRegistros"
                >0 registros</span
              >
            </form>
          </section>

          <section class="tabela-os">
            <div class="tabela-container">
              <table id="tabelaOrdens">
                <thead>
                  <tr>
                    <th scope="col">NÚMERO</th>
                    <th scope="col">EQUIPAMENTO</th>
                    <th scope="col">SETOR</th>
                    <th scope="col">TIPO</th>
                    <th scope="col">SOLICITANTE</th>
                    <th scope="col">CRIAÇÃO</th>
                    <th scope="col">FIM</th>
                    <th scope="col">STATUS</th>
                    <th scope="col">DETALHES</th>
                  </tr>
                </thead>
                <tbody id="corpoTabelaOrdens">
                  <tr>
                    <td colspan="9" style="text-align: center">
                      Carregando Ordens de Serviço...
                    </td>
                  </tr>
                </tbody>
              </table>
            </div>
          </section>
        </main>
      </div>
    </div>

    <script src="../-js/global.js"></script>
    <script src="../-js/pages/todas_os.js"></script>
  </body>
</html>
