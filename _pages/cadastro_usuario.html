<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>SGM - Novo Usuário</title>

    <!-- Caminho do CSS mantido -->
    <link rel="stylesheet" href="../-css/pages/cadastro_usuario.css" />
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css"
    />
  </head>

  <body>
    <div class="layout">
      <!-- Menu lateral -->
      <aside class="sidebar" id="sidebar">
        <div class="sidebar-header">
          <div class="logo">
            <span class="logo-icon">S</span>
            <div class="logo-text">
              <strong>SGM</strong>
              <span>Gestão de manutenção</span>
            </div>
          </div>
        </div>

        <nav class="sidebar-nav" aria-label="Navegação principal">
          <ul class="nav-list">
            <!-- ========================================== -->
            <!-- MENUS ADICIONADOS               -->
            <!-- ========================================== -->
            <li class="nav-item">
              <a href="dashboard.html">
                <button class="nav-link" type="button" data-menu="dashboard">
                  <span class="nav-icon"><i class="bi bi-list-task"></i></span>
                  <span>Dashboard</span>
                </button>
              </a>
            </li>

            <li class="nav-item">
              <a href="todas_os.html">
                <button class="nav-link" type="button" data-menu="ordens">
                  <span class="nav-icon"
                    ><i class="bi bi-clipboard-data"></i
                  ></span>
                  <span>Ordens de Serviço</span>
                </button>
              </a>
            </li>

            <li class="nav-item">
              <a href="todas_os.html">
                <button class="nav-link" type="button" data-menu="equipamentos">
                  <span class="nav-icon"
                    ><i class="bi bi-wrench-adjustable"></i
                  ></span>
                  <span>Equipamentos</span>
                </button>
              </a>
            </li>

            <li class="item-navegacao">
              <a href="setor_adm.html" class="link-navegacao">
                <span class="icone-navegacao"
                  ><i class="bi bi-collection"></i
                ></span>
                <span>Setor</span>
              </a>
            </li>

            <li class="item-navegacao">
              <a href="historico_adm.html" class="link-navegacao">
                <span class="icone-navegacao"
                  ><i class="bi bi-clock-history"></i
                ></span>
                <span>Histórico</span>
              </a>
            </li>

            <li class="item-navegacao">
              <a href="indicadores_adm.html" class="link-navegacao">
                <span class="icone-navegacao"
                  ><i class="bi bi-bar-chart"></i
                ></span>
                <span>Indicadores</span>
              </a>
            </li>

            <li class="item-navegacao">
              <a href="relatorios_adm.html" class="link-navegacao">
                <span class="icone-navegacao"
                  ><i class="bi bi-file-earmark-text"></i
                ></span>
                <span>Relatórios</span>
              </a>
            </li>

            <li class="nav-item">
              <a href="manutencao_adm.html">
                <button class="nav-link" type="button" data-menu="manutencao">
                  <span class="nav-icon"><i class="bi bi-tools"></i></span>
                  <span>Manutenção</span>
                </button>
              </a>
            </li>

            <li class="nav-item">
              <a href="pecas_adm.html">
                <button class="nav-link" type="button" data-menu="pecas">
                  <span class="nav-icon"><i class="bi bi-nut"></i></span>
                  <span>Peças</span>
                </button>
              </a>
            </li>
            <!-- ========================================== -->

            <li class="nav-item active">
              <button class="nav-link" type="button" data-menu="administracao">
                <span class="nav-icon"><i class="bi bi-people"></i></span>
                <span>Administração</span>
              </button>

              <ul class="submenu">
                <li class="submenu-item">
                  <a href="usuarios.html"> Usuários </a>
                </li>
                <li class="submenu-item">
                  <a href="niveis_acesso.html"> Níveis de acesso </a>
                </li>
              </ul>
            </li>
          </ul>
        </nav>
      </aside>

      <!-- Conteúdo principal -->
      <div class="main-wrapper">
        <!-- Cabeçalho -->
        <header class="topbar">
          <div class="topbar-left">
            <button
              class="menu-toggle"
              id="menuToggle"
              type="button"
              aria-label="Abrir menu"
            >
              ☰
            </button>
          </div>

          <div class="topbar-right">
            <!-- ========================================== -->
            <!-- ÍCONE DO SINO ADICIONADO PELO COLEGA       -->
            <!-- ========================================== -->
            <button
              class="notification-button"
              id="notificationButton"
              type="button"
              aria-label="Notificações"
            ></button>
            <!-- ========================================== -->

            <div class="perfil-container" style="position: relative">
              <!-- Botão clicável (Mantive as classes que você já usava: user-profile, user-avatar, user-info) -->
              <div
                class="user-profile"
                id="botaoPerfil"
                style="
                  cursor: pointer;
                  display: flex;
                  align-items: center;
                  gap: 12px;
                "
              >
                <div class="user-avatar avatar-usuario">AS</div>
                <div class="user-info informacoes-usuario">
                  <strong>Admin Sistema</strong>
                  <span>Administrador</span>
                </div>
                <i
                  class="bi bi-chevron-down"
                  style="color: #8a9cb4; font-size: 12px; margin-left: 5px"
                ></i>
              </div>

              <!-- Caixa do Dropdown (Escondida por padrão) -->
              <div class="dropdown-perfil" id="dropdownPerfil">
                <div class="dropdown-cabecalho">
                  <span class="dropdown-titulo">Conta</span>
                </div>
                <div class="dropdown-divisor"></div>
                <!-- LINK PARA A TELA DE PERFIL -->
                <a href="perfil.html" class="dropdown-item">
                  <i class="bi bi-person"></i> Meu Perfil
                </a>
                <div class="dropdown-divisor"></div>
                <button
                  type="button"
                  class="dropdown-item sair"
                  onclick="sairSistema()"
                >
                  <i class="bi bi-box-arrow-right"></i> Sair do Sistema
                </button>
              </div>
            </div>
          </div>
        </header>

        <!-- Conteúdo da página -->
        <main class="main-content">
          <div class="page-header">
            <h1>Novo Usuário</h1>
          </div>

          <div class="user-form-layout">
            <!-- Formulário -->
            <section class="form-card">
              <form id="userForm">
                <div class="form-group">
                  <label for="userName"> Nome completo </label>
                  <input
                    type="text"
                    id="userName"
                    name="name"
                    placeholder="Nome do usuário"
                    autocomplete="name"
                    required
                  />
                </div>

                <div class="form-row">
                  <div class="form-group">
                    <label for="userRegistration"> Matrícula </label>
                    <input
                      type="text"
                      id="userRegistration"
                      name="registration"
                      placeholder="Ex:12345"
                      required
                    />
                  </div>

                  <div class="form-group">
                    <label for="userContact"> Contato </label>
                    <input
                      type="tel"
                      id="userContact"
                      name="contact"
                      placeholder="(11) 99999-0000"
                      autocomplete="tel"
                    />
                  </div>
                </div>

                <div class="form-group">
                  <label for="userFunction"> Função </label>
                  <input
                    type="text"
                    id="userFunction"
                    name="function"
                    placeholder="Ex: Técnico de Manutenção"
                    required
                  />
                </div>

                <div class="form-group">
                  <label for="userPassword"> Senha </label>
                  <input
                    type="password"
                    id="userPassword"
                    name="password"
                    placeholder="Senha de Acesso"
                    autocomplete="new-password"
                    required
                  />
                </div>

                <div class="form-group">
                  <label for="userLevel"> Nível de acesso </label>
                  <!-- ========================================== -->
                  <!-- VALORES (VALUES) ALTERADOS PELO COLEGA     -->
                  <!-- ========================================== -->
                  <select id="userLevel" name="level" required>
                    <option value="1">Administrador</option>
                    <option value="2">Úsuario-Criação de OS</option>
                    <option value="3">Técnico</option>
                    <option value="4">Gerencia</option>
                  </select>
                  <!-- ========================================== -->
                </div>

                <div class="form-actions">
                  <a href="usuarios.html" class="button button-secondary">
                    Cancelar
                  </a>
                  <button
                    type="submit"
                    class="button button-primary"
                    id="saveUserButton"
                  >
                    Cadastrar Usuário
                  </button>
                </div>
              </form>
            </section>

            <!-- Área para ilustração -->
            <aside class="form-illustration" aria-hidden="true">
              <div class="illustration-shape illustration-circle-large"></div>
              <div class="illustration-shape illustration-circle-small"></div>
              <div class="illustration-shape illustration-quarter"></div>
              <div class="illustration-shape illustration-arc"></div>
              <div class="illustration-shape illustration-square"></div>
              <div class="illustration-dot illustration-dot-one"></div>
              <div class="illustration-dot illustration-dot-two"></div>
              <div class="illustration-dot illustration-dot-three"></div>
              <div class="illustration-lines illustration-lines-one"></div>
              <div class="illustration-lines illustration-lines-two"></div>
            </aside>
          </div>
        </main>
      </div>
    </div>

    <!-- Caminho do JS mantido -->
    <script src="../-js/global.js"></script>
    <script src="../-js/pages/cadastro_usuario.js"></script>
  </body>
</html>
